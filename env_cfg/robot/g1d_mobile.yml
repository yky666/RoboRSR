robots:
  - {
    robot_type: arm,
    # G1-D Flagship: g1d plus the differential chassis (base_velocity [vx, vyaw]) on virtual planar joints.
    robot_name: g1d_mobile,
    coupled: True,
    need_planner: False,
    # Start pose as in g1d (office); the chassis moves from here, base_pose is relative to it.
    default_root_pos: [0.0, -0.73, 0.1115],
    default_root_rot: [0.707, 0, 0, 0.707],
    # Office tabletop 0.715 m (fit_table.py) is 0.035 m above the 0.68 m every lift is set from: raise it by as much.
    init_joint_pos: {LZ_mt_Joint: 0.0175, LZ_it_Joint: 0.0175}
  }
