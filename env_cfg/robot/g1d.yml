robots:
  - {
    robot_type: arm,
    robot_name: g1d,
    coupled: True,
    # Joint-space actions only for now: ee_pose actions need a G1-D curobo config (per arm).
    need_planner: False,
    # AGV origin; wheels touch the ground at z=0. y=-0.73 keeps the waist column behind the table edge.
    default_root_pos: [0.0, -0.73, 0.1115],
    default_root_rot: [0.707, 0, 0, 0.707],
    # Office tabletop 0.715 m (fit_table.py) is 0.035 m above the 0.68 m every lift is set from: raise it by as much.
    init_joint_pos: {LZ_mt_Joint: 0.0175, LZ_it_Joint: 0.0175}
  }
