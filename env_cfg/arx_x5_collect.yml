config_name: arx_x5  # the arx_x5 layouts; scripts/datagen/collect.py on the X5 benchmark tasks

config:
  sim: sim_config
  scene: default
  robot: dual_x5
  camera: camera_config

observation:
  collect_freq: 25
  robot:
    joint_states: true
    world_ee_state: true
  vision:
    approximate_depth: false
    depth: false
    intrinsic_matrix: true  # the official X5 training data carries both camera matrices
    extrinsic_matrix: true
    shape: true
