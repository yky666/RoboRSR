config_name: g1d_counter_mobile

config:
  sim: g1d_sim_config
  scene: default
  robot: g1d_counter_mobile
  camera: g1d_counter_mobile_camera  # g1d_camera with cam_third moved to see the lounge

observation:
  collect_freq: 30
  robot:
    joint_states: true
    world_ee_state: true
    ee_state: measured  # gripper state from the finger joints, not the last command (scripts/datagen/CONTRACT.md)
    body_states: true  # waist, lift, chassis (base_velocity, base_pose) in obs
  vision:
    approximate_depth: false
    depth: false
    intrinsic_matrix: false
    extrinsic_matrix: false
    shape: true
