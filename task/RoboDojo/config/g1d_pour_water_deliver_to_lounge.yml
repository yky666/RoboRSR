# G1-D mobile manipulation (env config g1d_counter_mobile, real_scene2 with its lounge): one hand pours water from the
# fridge jug into the cup the other hand holds up at the counter (as g1d_pour_water_into_cup), the jug goes back down,
# then the cup is carried to the lounge's round table. Eval layouts are generated by scripts/g1d/build_asset.py
# (pour_deliver_layout): g1d_counter's jug-and-cup layouts moved with the mobile chassis, ~300 ml of water (PBD liquid)
# in the jug, the chairs as in g1d_deliver_cup_to_lounge. The sections below describe that layout.
Rigid:
  -
    common:
      xlim: [[-0.30, -0.05], [0.05, 0.30]]
      ylim: [-0.523, -0.273]  # g1d_pour_water_into_cup's, -0.07 (counter) -0.053 (chassis)
      rotate_rand: False
      rotate_deg: 0
      relative_plane: "Table"
      qpos: [1, 0, 0, 0]
      margin: 0.04

    category:
      -
        name: "pitcher"
        index: [0, 1, 2]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["bottle"]  # reward label, the object is our fridge jug

  -
    common:
      xlim: [-0.05, 0.05]
      ylim: [-0.513, -0.413]  # 9 cm closer than the jug (POUR_CUP_PULL), as above
      rotate_rand: False
      rotate_deg: 0
      relative_plane: "Table"
      qpos: [1, 0, 0, 0]
      margin: 0.04

    category:
      -
        name: "water_cup"  # our handleless enamel cup (scripts/objects/make_water_cup.py), grasped around its body
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["cup"]
  -
    common:
      xlim: [-0.05, 0.05]  # jitter about each chair's photo pose (build_params.json "lounge")
      ylim: [-0.05, 0.05]
      rotate_rand: True
      rotate_deg: 10
      relative_plane: "ground"

    category:
      -
        name: lounge_chair
        index: [0, 1]

    select_mode:
      nums: 6
      mode: "allow_duplicate"
      label: ["chair_0", "chair_1", "chair_2", "chair_3", "chair_4", "chair_5"]

Fluid:
  -
    common:
      xlim: [0.0, 0.0]
      ylim: [0.0, 0.0]
      zlim: [-0.0555, -0.0555]  # build_asset.py WATER_Z
      rotate_rand: False
      relative_plane: "bottle"
      check_mode: "enforce"

    category:
      -
        name: "wuliangye"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["water"]
