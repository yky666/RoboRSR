<style>
/* every colour is light-dark(day, night); <html data-theme> picks light / dark / system through color-scheme */
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
:root {
  --bg: light-dark(#FFFFFF, #0C0C0E); --surface: light-dark(#FFFFFF, #141417); --surface-2: light-dark(#F8F8F9, #1C1C20); --surface-3: light-dark(#F0F0F2, #26262B);
  --border: light-dark(#EEEEF0, #25252A); --border-strong: light-dark(#E1E1E5, #34343B);
  --text: light-dark(#111113, #EDEDEF); --text-2: light-dark(#3F3F46, #C8C8CE); --muted: light-dark(#6B6B74, #91919A); --faint: light-dark(#A1A1AA, #5F5F68);
  --primary: light-dark(#111113, #EDEDEF); --primary-hover: light-dark(#2E2E33, #FFFFFF); --on-primary: light-dark(#FFFFFF, #111113);
  --primary-soft: light-dark(#F4F4F5, #1F1F23); --primary-line: light-dark(#D4D4D8, #3A3A41); --ring: light-dark(#111113, #EDEDEF);
  --link: light-dark(#1D4ED8, #7AAEFF); --info: light-dark(#2563EB, #7AAEFF); --info-soft: light-dark(#EEF4FF, #16203A);
  --accent: light-dark(#D97706, #F59E0B); --accent-text: light-dark(#B45309, #FBBF24); --accent-soft: light-dark(#FEF3C7, #2B210C);
  --ok: light-dark(#15803D, #4ADE80); --ok-soft: light-dark(#E7F8EC, #10261A); --ok-bar: #22C55E;
  --bad: light-dark(#B91C1C, #F87171); --bad-soft: light-dark(#FDECEC, #2B1414); --bad-bar: #EF4444;
  --todo: light-dark(#52525B, #A1A1AA); --todo-soft: light-dark(#F4F4F5, #1F1F23); --todo-bar: light-dark(#E2E2E6, #34343B);
  --glass: light-dark(rgba(255, 255, 255, .9), rgba(20, 20, 23, .86));
  --radius: 16px; --radius-sm: 10px;
  --shadow-1: none;
  --shadow-2: 0 10px 30px light-dark(rgba(17, 17, 19, .07), rgba(0, 0, 0, .45));
  --shadow-3: 0 24px 60px light-dark(rgba(17, 17, 19, .18), rgba(0, 0, 0, .6));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --gbar: 56px; --sub: 56px; --top: calc(var(--gbar) + var(--sub));
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font: 14px/1.55 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
h1, h2, h3 { letter-spacing: -.02em; }
.mono, code { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.txt-bad { color: var(--bad); }
.txt-ok { color: var(--ok); }
.sp { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.ic-sm { width: 13px; height: 13px; }
.ic-lg { width: 18px; height: 18px; }

/* layout */
.app { display: flex; flex-direction: column; min-height: 100vh; }
/* product bar (BanzhiFlywheel · 仿真平台 / 数据集) over the simulation platform's own navigation */
.gbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: stretch; gap: 32px; height: var(--gbar); padding: 0 max(40px, calc((100% - 1440px) / 2)); background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; flex: none; align-items: center; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; }
/* text-only logo: heavy "Banzhi", light "Flywheel", a blue full stop */
.wordmark { display: inline-flex; align-items: baseline; font-size: 23px; font-weight: 800; line-height: 1; letter-spacing: -.045em; white-space: nowrap; }
.wordmark em { font-style: normal; font-weight: 400; letter-spacing: -.035em; }
.wordmark::after { content: ""; width: .26em; height: .26em; margin-left: .08em; border-radius: 50%; background: var(--link); }
.gbar .products { display: flex; flex: none; align-items: stretch; gap: 24px; margin: 0; overflow: visible; }
.product { position: relative; display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 500; transition: color .15s; }
.product:hover { color: var(--text); text-decoration: none; }
.product[aria-current="page"] { color: var(--text); font-weight: 600; }
.product[aria-current="page"]::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; border-radius: 2px; background: var(--text); }
.login-brand { flex-direction: column; align-items: flex-start; gap: 8px; }
.login-brand .wordmark { font-size: 30px; }
.theme { display: flex; align-self: center; gap: 2px; margin-left: auto; padding: 2px; border-radius: 999px; background: var(--surface-2); }
.theme .btn-icon { width: 28px; min-height: 28px; color: var(--muted); }
.theme .btn-icon:hover { color: var(--text); }
.theme .btn-icon[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.gbar .me { align-self: center; gap: 2px; margin-left: -12px; }
.gbar .me .sp, .gbar .me-name small { display: none; }
.guest-tag { gap: 4px; margin-right: 8px; font-family: var(--font); }
.gbar .avatar { width: 28px; height: 28px; margin-right: 6px; font-size: 13px; }
.gbar .me-name { margin-right: 6px; }
.gbar .me-name b { font-weight: 500; }
.gbar .me .btn-icon { width: 32px; min-height: 32px; color: var(--muted); }
.gbar .me .btn-icon:hover { color: var(--text); }
.side { position: sticky; top: var(--gbar); z-index: 5; display: flex; align-items: center; gap: 24px; min-height: var(--sub); padding: 0 max(40px, calc((100% - 1440px) / 2)); background: var(--bg); border-bottom: 1px solid var(--border); }
.app.no-sub .side { display: none; }
.side .nav-item[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
nav { display: flex; flex: 1; justify-content: flex-start; gap: 2px; min-width: 0; margin-left: -12px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
/* inner panels still scroll by wheel, trackpad and keyboard, without a bar; wide tables and code keep theirs */
.ds-side, .strip, .opick-list, .clutter-cats, .dr-b, .qa-list { scrollbar-width: none; }
.ds-side::-webkit-scrollbar, .strip::-webkit-scrollbar, .opick-list::-webkit-scrollbar, .clutter-cats::-webkit-scrollbar, .dr-b::-webkit-scrollbar, .qa-list::-webkit-scrollbar { display: none; }
.nav-item { display: flex; flex: none; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; color: var(--muted); font-weight: 500; transition: background .15s, color .15s; }
.nav-item > .ic { display: none; }
.nav-item:hover { color: var(--text); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.nav-item .count { color: var(--faint); font: 500 12px var(--mono); }
.nav-item .badge { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font: 600 11px/18px var(--mono); text-align: center; }
.side-foot { display: flex; flex: none; align-items: center; gap: 12px; }
.side-foot .btn-primary { min-height: 36px; padding: 0 16px; }
.side-foot .source { order: -1; }
.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.me { display: flex; align-items: center; gap: 4px; min-width: 0; }
.avatar { display: grid; flex: none; place-items: center; width: 32px; height: 32px; margin-right: 4px; border-radius: 50%; background: var(--surface-2); color: var(--text); font-weight: 650; }
.me-name { max-width: 120px; min-width: 0; overflow: hidden; line-height: 1.25; }
.me-name b { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.me-name small { color: var(--muted); font: 11px var(--mono); }
.login { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, var(--surface-2) 0, transparent 55%), var(--bg); }
.login-card { display: flex; flex-direction: column; gap: 14px; width: min(400px, 100%); padding: 32px; border-radius: 20px; box-shadow: var(--shadow-2); }
.login-card h1 { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
.login-card p { margin: 0; }
.login-card .field { color: var(--text-2); font-size: 13px; font-weight: 500; }
.login-card input:not([type=checkbox]) { width: 100%; min-height: 40px; }
.pw { position: relative; }
.pw input { padding-right: 42px !important; }
.pw .btn { position: absolute; top: 3px; right: 3px; min-height: 34px; border: 0; background: transparent; }
.field-error { margin: 0; color: var(--bad); font-size: 12px; }
.source { display: grid; place-items: center; width: 20px; height: 20px; cursor: help; }
.source .dot { margin: 0; }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; }
.dot.ok { background: var(--ok-bar); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.warn { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
main { flex: 1; min-width: 0; padding: 36px 40px 72px; }
.page { max-width: 1440px; margin: 0 auto; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 24px; }
.ph h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; }
.ph p { max-width: 860px; margin: 8px 0 0; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.filters { margin-bottom: 18px; }
.filters > select, .ph .toolbar > select { padding: 0 14px; border-radius: 999px; }
@media (max-width: 1240px) {
  .gbar, .side { gap: 16px; padding: 0 24px; }
  main { padding: 28px 24px 56px; }
}
@media (max-width: 720px) {
  .gbar { gap: 18px; padding: 0 14px; }
  .gbar .products { gap: 16px; }
  .wordmark { font-size: 19px; }
  .side { flex-wrap: wrap; gap: 0 12px; padding: 8px 14px 0; }
  .side nav { flex: 1 1 100%; order: 3; margin: 4px 0 0 -12px; padding-bottom: 8px; }
  .side-foot { margin-left: auto; }
  .me-name, .source { display: none; }
  .brand small { display: none; }
  main { padding: 20px 14px 40px; }
  .ph h1 { font-size: 22px; }
}

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px 0; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 650; }
.card-b { padding: 14px 20px 20px; }
.section-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 40px 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.section-title > .ic { display: none; }
.section-title .muted { font-weight: 400; letter-spacing: 0; }
.lib { margin-top: 24px; }
.lib > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 48px; margin: 0 -12px 12px; padding: 8px 12px; border-radius: 12px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; list-style: none; cursor: pointer; }
.lib > summary::-webkit-details-marker { display: none; }
.lib > summary:hover { background: var(--surface-2); }
.lib > summary .chev { transition: transform .15s ease-out; }
.lib[open] > summary .chev { transform: rotate(90deg); }
.lib > summary .count { padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font: 500 12px/20px var(--mono); }
.lib > summary .lib-desc { flex-basis: 100%; padding-left: 26px; font-weight: 400; letter-spacing: 0; }
.lib-status { margin-bottom: 12px; flex-wrap: wrap; }
/* floats over the page so ticking the first object does not push the cards under the pointer */
.obj-bulk { position: fixed; bottom: 16px; left: 50%; z-index: 15; width: min(720px, calc(100vw - 32px)); transform: translateX(-50%); border-radius: 14px; box-shadow: var(--shadow-3); }
.page:has(.obj-bulk) { padding-bottom: 140px; }

.obj-bulk { width: min(900px, calc(100vw - 32px)); }
.obj-bulk select { min-height: 30px; }
.obj-bulk input[type=text] { flex: 1; min-width: 200px; min-height: 30px; border-color: transparent; color: var(--text); }
.obj-bulk .dd-btn { min-height: 30px; }
.bulk-hint { color: color-mix(in srgb, var(--on-primary) 65%, transparent); font-size: 12px; }
.bulk-sep { width: 1px; height: 18px; margin: 0 2px; background: color-mix(in srgb, var(--on-primary) 25%, transparent); }
.bulkbar .btn:disabled { opacity: .45; }
.osel { flex: none; width: 18px; height: 18px; margin: 0; cursor: pointer; }

.review-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.review-note { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--border-strong); background: var(--surface-2); white-space: pre-wrap; }
.review-log { margin: 14px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
.review-log li { padding: 8px 0; border-bottom: 1px solid var(--border); }
@media (prefers-reduced-motion: reduce) { .lib > summary .chev { transition: none; } }

.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); }
.kpi { display: block; padding: 18px 20px 20px; color: inherit; transition: border-color .2s, box-shadow .2s; }
.kpi:hover { border-color: var(--primary-line); box-shadow: var(--shadow-2); text-decoration: none; }
.k-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
.k-label .ic { width: 28px; height: 28px; padding: 6px; border-radius: 50%; background: var(--surface-2); color: var(--text-2); }
.k-value { margin: 14px 0 4px; font: 700 30px/1.1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.k-meta { color: var(--muted); font-size: 12px; }
/* label-over-number tiles on cards */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.stats > div { min-width: 0; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.stats span { display: block; color: var(--muted); font-size: 11px; }
.stats b { display: block; overflow: hidden; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
.pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.duo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1280px) { .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .duo { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .pipeline { grid-template-columns: 1fr; } }
.step { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font: 700 11px var(--mono); }
.meter { display: grid; grid-template-columns: minmax(96px, 1fr) minmax(60px, 1.2fr) auto; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
.meter .lbl { color: var(--text-2); }
.meter .val { min-width: 64px; color: var(--muted); font: 12px var(--mono); text-align: right; }
.callout { display: flex; gap: 10px; margin-bottom: 16px; padding: 12px 16px; border: 1px solid light-dark(#FDE68A, #4A3A12); border-radius: 12px; background: light-dark(#FFFBEB, #221A08); color: light-dark(#92400E, #FCD34D); font-size: 13px; }
.callout.bad { border-color: light-dark(#FECACA, #4A1D1D); background: light-dark(#FEF2F2, #241010); color: light-dark(#991B1B, #FCA5A5); }
.callout.ok { border-color: light-dark(#BBF7D0, #14402A); background: light-dark(#F0FDF4, #0D2016); color: light-dark(#166534, #86EFAC); }
.users { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 1000px) { .users { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack .field { color: var(--text-2); font-size: 13px; font-weight: 500; }
.stack input:not([type=checkbox]) { width: 100%; }
.pw-row { display: flex; gap: 6px; }
.pw-row input { flex: 1; min-width: 0; }
.callout .ic { margin-top: 2px; }
.empty { display: grid; place-items: center; gap: 6px; padding: 40px 16px; color: var(--muted); text-align: center; }
.empty .ic { width: 28px; height: 28px; color: var(--faint); }
.empty b { color: var(--text-2); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--text); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: var(--faint); background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); }
.btn-ok { border-color: var(--ok); background: var(--ok); color: var(--on-primary); }
.btn-ok:hover { background: #166534; }
.btn-bad { border-color: var(--bad); background: var(--bad); color: var(--on-primary); }
.btn-bad:hover { background: #991B1B; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { border-color: transparent; }
.btn-icon { width: 36px; padding: 0; }
.btn-block { width: 100%; }
.btn-lg { min-height: 44px; }
kbd { padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; font: 500 11px/16px var(--mono); opacity: .75; }
input:not([type=checkbox]):not([type=file]), select, textarea { min-height: 36px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
input:not([type=checkbox]):not([type=file]):hover, select:hover, textarea:hover { border-color: var(--faint); }
input:not([type=checkbox]):not([type=file]):not([type=range]):focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--ring); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 14%, transparent); }
input:read-only:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]), textarea:read-only { border-color: transparent; background: var(--surface-2); cursor: default; }
input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); cursor: pointer; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
select { cursor: pointer; }
.search { position: relative; }
.search .ic { position: absolute; top: 10px; left: 14px; color: var(--muted); pointer-events: none; }
.search input { width: 240px; padding-left: 38px !important; border-radius: 999px !important; }
.check { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; color: var(--text-2); cursor: pointer; }
.segctl { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.segctl button { min-height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--text-2); font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
.segctl button:hover { color: var(--text); }
.segctl button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.segctl button[aria-pressed="true"] .muted { color: color-mix(in srgb, var(--on-primary) 72%, transparent); }
/* sliding thumb behind the picked button (segSlide); the buttons go transparent only once it is in place */
.segctl { position: relative; isolation: isolate; }
.seg-thumb { position: absolute; top: 0; left: 0; z-index: -1; border-radius: 999px; background: var(--primary); pointer-events: none;
  transition: transform .28s cubic-bezier(.2, .8, .2, 1), width .28s cubic-bezier(.2, .8, .2, 1), height .28s cubic-bezier(.2, .8, .2, 1); }
.segctl.slid button { transition: color .2s; }
.segctl.slid button[aria-pressed="true"] { background: transparent; }
.segctl.slid button .muted { transition: color .2s; }
@media (prefers-reduced-motion: reduce) { .seg-thumb { transition: none; } }

/* status */
.st { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px solid transparent; border-radius: 999px; background: var(--todo-soft); color: var(--todo); font-size: 12px; font-weight: 500; white-space: nowrap; }
.st .ic { width: 12px; height: 12px; }
.st.ok { background: var(--ok-soft); color: var(--ok); }
.st.bad { background: var(--bad-soft); color: var(--bad); }

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const file = (p) => `/file?path=${encodeURIComponent(p)}`;
const small = (p, w) => `${file(p)}&w=${w}`;  // server-side WebP copy, w in THUMB_WIDTHS
const num = (v) => v !== null && v !== undefined && v !== '' && !Number.isNaN(Number(v));
const pct = (x) => (num(x) ? `${Math.round(x * 100)}%` : '—');
const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const fmtTime = (t) => (t ? new Date(t * 1000).toLocaleString('zh-CN', {hour12: false}) : '');
const live = (xs) => xs.filter((d) => !d.auto?.missing);
const group = (xs, key) => xs.reduce((m, x) => ((m[key(x)] ||= []).push(x), m), {});
const rel = (p) => (p && INFO.root && p.startsWith(`${INFO.root}/`) ? p.slice(INFO.root.length + 1) : p);
const base = (p) => String(p).split('/').pop();
const opts = (options, value) => Object.entries(options).map(([k, l]) => `<option value="${esc(k)}" ${k === String(value ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

const KINDS = ['scene', 'object', 'task', 'episode', 'embodiment', 'evaluation', 'prototype'];
const TAB_OF = {scene: 'scenes', object: 'objects', task: 'tasks', episode: 'qa', embodiment: 'robots', evaluation: 'evals', prototype: 'prototypes'};
const KIND_LABEL = {scene: '场景', object: '物体', task: '任务', episode: '回合', embodiment: '本体', evaluation: '评测', prototype: '研究资产'};
const S = {scene: [], object: [], task: [], episode: [], embodiment: [], evaluation: [], prototype: [], library: []};
const UI = {
  tab: 'overview', drawer: null, ep: null, taskDim: 'custom', taskQ: '', sel: new Set(), loaded: false, syncing: false, syncedAt: '',
  osel: new Set(),  // objects ticked on the objects page, for bulk review and owner assignment
  bulk: {owner: '', reject: false, note: ''},
  ds: {pick: {}, ep: [0, 100], q: '', sort: 'rec', view: 'grid', closed: ['robot', 'skill', 'format', 'license', 'platform', 'local']},  // datasets page filters
  dd: '',  // id of the open dropdown menu
  qaRate: 1,  // playback speed of the QA videos, kept when another episode is picked
  vpick: {},  // object drawer id -> the variant whose render is previewed in it
  obj: {q: '', photo: false, status: '', owner: '', view: localStorage.objView || 'cards', closed: new Set((() => { try { return JSON.parse(localStorage.objLibClosed || '[]'); } catch { return []; } })())},
  qa: {task: '', config: '', policy: '', result: '', status: 'pending'},
};
let INFO = {};
let ME = null;
let USERS = [];
let MEMBERS = [];  // [{username, name}] of every account, to pick owners from
const memberName = (u) => typeof u === 'object' && u ? (u.name || u.username || '') : (MEMBERS.find((m) => m.username === u)?.name || u || '');
const memberOpts = (value) => ({'': '未指定', ...Object.fromEntries(MEMBERS.map((m) => [m.username, `${m.name}（${m.username}）`])),
  ...(value && !MEMBERS.some((m) => m.username === value) ? {[value]: `${value}（不是平台账号）`} : {})});
let IDX = {};  // indices in use per <type>/<category>, for registering objects
let EP_BY_TASK = {};
const GAL = {};

// ---------- stages: [key, label, doc -> {s: ok | bad | todo | na, t: detail}] ----------
const ok = (t = '') => ({s: 'ok', t});
const bad = (t = '') => ({s: 'bad', t});
const todo = (t = '') => ({s: 'todo', t});
const na = (t = '') => ({s: 'na', t});
const flag = (v, hint) => (v ? ok('已完成') : todo(hint));
const STATE = {ok: '通过', bad: '不通过', todo: '待办', na: '不适用'};
const STATE_IC = {ok: 'check', bad: 'x', todo: 'circle', na: 'minus', warn: 'eye'};
const evalStages = (stages, d) => stages.map(([k, label, fn]) => ({k, label, ...fn(d)}));
const allOk = (stages, d) => evalStages(stages, d).every((r) => r.s === 'ok' || r.s === 'na');

const MIN_SCENE_PHOTOS = 5;
const sceneTopZ = (d) => (num(d.measured_top_z) ? Number(d.measured_top_z) : num(d.reg?.top_z_cm) ? d.reg.top_z_cm / 100 : null);
const SCENE_STAGES = [
  ['photos', `照片 ≥ ${MIN_SCENE_PHOTOS} 张`, (d) => {
    const n = d.auto.photos?.length || 0;
    return n >= MIN_SCENE_PHOTOS ? ok(`${n} 张参考照片`) : todo(`reference/ 下 ${n} 张，至少 ${MIN_SCENE_PHOTOS} 张不同角度`);
  }],
  ['fit', '相机拟合', (d) => (!d.auto.fit_views ? todo('没有 fit_photo.json 或 cameras_scene.json')
    : ok(d.auto.fit_max_px == null ? `${d.auto.fit_views} 个 SfM 相机` : `${d.auto.fit_views} 个视角，最大残差 ${d.auto.fit_max_px} px`))],
  ['build', 'USD 构建', (d) => (d.auto.built ? ok(d.auto.rooms.join('、')) : todo('缺 usd/scene.usda 或 Room 入口'))],
  ['check', '离线检查', (d) => (!d.auto.checks_total ? todo('没有 check_report.json')
    : d.auto.checks_failed.length ? bad(`${d.auto.checks_failed.length}/${d.auto.checks_total} 项未通过`) : ok(`${d.auto.checks_total} 项全部通过`))],
  ['measure', '尺寸实测 < 1 cm', (d) => {
    const top = sceneTopZ(d);
    if (top == null) return todo('卷尺实测桌高、桌沿相对机器人的位置');
    if (!num(d.auto.top_z)) return todo(`实测桌高 ${top} m，模型还没建`);
    const dz = Math.abs(top - d.auto.top_z) * 100;
    const edge = num(d.edge_err_cm) ? Math.abs(d.edge_err_cm) : null;
    const text = `桌高差 ${dz.toFixed(1)} cm，${edge == null ? '桌沿未实测' : `桌沿差 ${edge} cm`}`;
    if (dz >= 1 || edge >= 1) return bad(text);
    return edge == null ? todo(text) : ok(text);
  }],
  ['overlay', '叠图 < 5 px（≥ 3 视角）', (d) => {
    if (!num(d.overlay_px)) return todo('用标定好的头部相机把仿真渲染和真机照片叠图');
    const text = `最大偏差 ${d.overlay_px} px，${d.overlay_views || 0} 个视角`;
    return d.overlay_px < 5 && d.overlay_views >= 3 ? ok(text) : bad(text);
  }],
  ['lighting', '灯光建模', (d) => flag(d.lighting, '按现场记录建模灯的类型、位置和大致亮度')],
  ['isaac', 'Isaac 渲染验证', (d) => flag(d.isaac, 'RTX 渲染，与真机头部相机画面对比')],
  ['shared', '入共享资产库', (d) => flag(d.shared, 'build_asset.py 装入 Assets/Room/ 并生成布局')],
];

const MATERIALS = ['PP 塑料', 'PET 塑料', 'PS 塑料', '玻璃', '陶瓷', '不锈钢', '铝', '木', '纸', '硅胶', '布'];
const OBJECT_TYPES = {Rigid: '刚体', Articulation: '关节物体', Clutter: '杂物', Dynamic: '动态装置', Fluid: '流体', Garment: '衣物', Geometry: '固定物体'};
const METHODS = {'': '未定', script: '参数化脚本', photogrammetry: '摄影测量', generative: '3D 生成模型', library: '开源 / 官方物体库'};
const CHECK_STATES = {'': '未测', pass: '通过', fail: '不通过', na: '不适用'};
const PHYS = [
  ['settle', '落地静置', '1 s 内稳定，倾斜 < 1°，速度 < 5 mm/s', (d) => `PYTHONPATH=. python scripts/objects/check_object.py ${objPath(d)} --image-dir real2sim/objects`],
  ['collision', '碰撞体', '与桌面、其他物体初始无穿插；容器口没被碰撞体封住', () => ''],
  ['grasp', '抓取', 'Dex1 用脚本抓起，保持 3 s 不滑落', () => ''],
  ['liquid', '盛液（仅容器）', '静置时液体保留率 ≥ 99%',
    () => 'PYTHONPATH=. python scripts/objects/check_pitcher_fluid.py --device cpu --out output/pitcher/fluid   # 壶\nPYTHONPATH=. python scripts/objects/check_cup_beans.py --out output/plastic_cups/beans   # 杯子装豆'],
  ['render', '光照渲染', '3 种灯光预设下截图，无穿透、黑面、折射错误；人工复核', () => ''],
];
// "开口直径 82，底部直径 64，高 135" -> [{name, real}] in mm; a unit right after a number is not part of the next name
const SEP = /\s*[×xX*]\s*/;
const expandDims = (text) => String(text || '').replace(  // "(高 × 宽 × 厚)：46.4 × 54.4 × 21.4" -> "高 46.4，宽 54.4，厚 21.4"
  /[^\d\s，,；;、:：=+（(]*[（(]([^）)]+)[）)]\s*[:：=]?\s*(\d+(?:\.\d+)?(?:\s*[×xX*]\s*\d+(?:\.\d+)?)+)/g,
  (all, names, values) => {
    const n = names.trim().split(SEP), v = values.split(SEP);
    return n.length === v.length ? n.map((x, i) => `${x} ${v[i]}`).join('，') : all;
  });
const parseDims = (text) => [...expandDims(text).matchAll(/([^\d\s，,；;、:：=+]+)\s*[:：=]?\s*(\d+(?:\.\d+)?)/g)]
  .map((m) => ({name: m[1].replace(/^(mm|毫米)/i, ''), real: Number(m[2])})).filter((r) => r.name);
const dimText = (d) => parseDims(d.dimensions).map((r) => `${r.name} ${r.real}`).join(' · ');
const measured = (d) => num(d.real_mass) && parseDims(d.dimensions).length > 0;
const hasPhotoReference = (d) => Boolean(d.auto.photos?.length || d.photo_reference?.received || d.auto.photo_reference?.received);
function dimCheck(d) {  // each measured dimension against the built model's metadata.json measurements_mm, by name
  return parseDims(d.dimensions).map(({name, real}) => {
    const meta = d.auto.measurements?.[name], sim = num(meta) ? Number(meta) : null, err = sim == null ? null : Math.abs(sim - real);
    return {name, real, sim, err, ok: err != null && err <= Math.max(2, 0.02 * real)};
  });
}
// a verdict picked in the page wins; otherwise preview/check.json: settle from check_object.py, the rest from the agent
const autoPhys = (d, k) => d.auto.check?.checks?.[k] || (k === 'settle' ? d.auto.check?.settle : '') || '';
const physState = (d, k) => d.checks?.[k] || (['pass', 'fail', 'na'].includes(autoPhys(d, k)) ? autoPhys(d, k) : '');
const OBJ_STAGES = [
  ['measure', '实物测量', (d) => (!d.twin ? na('无实物来源登记') : measured(d) ? ok(`${dimText(d)} mm，${d.real_mass} g`)
    : todo('实物来源已登记；尺寸/质量待测，现有估计参数可继续使用'))],
  ['model', '建模', (d) => (d.auto.in_library ? ok(d.method ? METHODS[d.method] : '资产库中已有')
    : d.auto.check?.checked_at ? ok(`已建好，${d.auto.check.checked_at} 落地检查${d.auto.check.settle === 'pass' ? '通过' : '不通过'}`)
    : todo(d.auto.generator ? `有生成脚本 ${d.auto.generator}，还没有建好的资产` : '交给 coding agent 按建模任务建模'))],
  ['dims', '尺寸 / 质量核对', (d) => {
    if (!d.twin) return na('无实物来源登记');

function simReal(eps) {
  const pairs = eps.filter((e) => e.real === 'success' || e.real === 'fail');
  if (!pairs.length) return null;
  let a = 0, b = 0, c = 0, d = 0;
  for (const e of pairs) {
    const sim = e.auto.success, real = e.real === 'success';
    if (sim && real) a++; else if (sim) b++; else if (real) c++; else d++;
  }
  const n = pairs.length, A = (a + d) / n, pe = ((a + b) * (a + c) + (c + d) * (b + d)) / (n * n);
  return {n, a, b, c, d, A, kappa: pe < 1 ? (A - pe) / (1 - pe) : null, trust: a + b ? a / (a + b) : null};
}

function segSlide(before) {
  document.querySelectorAll('.segctl').forEach((el, i) => {
    const on = el.querySelector(':scope > button[aria-pressed="true"]');
    let t = el.querySelector(':scope > .seg-thumb');
    el.classList.add('slid');  // before the first layout, so the picked button never paints (and fades) its own background
    if (!on || !on.offsetWidth) {  // nothing picked, or hidden in a closed section: the button paints itself
      t?.remove();
      el.classList.remove('slid');
      return;
    }
    if (!t) {
      t = document.createElement('span');
      t.className = 'seg-thumb';
      t.setAttribute('aria-hidden', 'true');
      el.prepend(t);
    }
    const place = (at) => {
      const [x, y, w, h] = at.split(',');
      t.style.transform = `translate(${x}px, ${y}px)`;
      t.style.width = `${w}px`;
      t.style.height = `${h}px`;
    };
    const to = [on.offsetLeft, on.offsetTop, on.offsetWidth, on.offsetHeight].join(), from = before?.get(segKey(el, i));
    if (from && from !== to) {
      t.style.transition = 'none';
      place(from);
      t.getBoundingClientRect();
      t.style.transition = '';
    }
    place(to);
    t.dataset.at = to;
  });
}

function viewPrototypes() {

async function saveAppearance(id) {

function taskIdError() {  // [message, field] when the task id is unusable, or ['']

function taskWizError() {  // [message, field selector] blocking the current step, or ['']
  if (WIZ_AT === 0) {
    if (!$('#nt-name').value.trim()) return ['填写中文名称', '#nt-name'];
    if (!$('#nt-name-en').value.trim()) return ['填写英文名称', '#nt-name-en'];
    const id = taskIdError();
    if (id[0]) return id;
    if (!$('#nt-definition').value.trim()) return ['用中文写下任务定义，coding agent 据此总结语言指令', '#nt-definition'];
    const n = Number($('#nt-inst-n').value);
    if (!Number.isInteger(n) || n < 1 || n > 50) return ['指令转写数量为 1–50 的整数', '#nt-inst-n'];
    if (!$$('[data-lang]:checked').length) return ['至少选一种指令语言', '[data-lang]'];
    if (!$('#nt-success').value.trim()) return ['写下成功判据，否则无法实现 run_reward', '#nt-success'];
  }
  if (WIZ_AT === 1) {
    const labels = NT.roles.map((r) => r.label);
    const i = NT.roles.findIndex((r) => !/^\w+$/.test(r.label) || labels.indexOf(r.label) !== labels.lastIndexOf(r.label));
    if (i >= 0) return ['每个角色要有唯一的 label（字母、数字、下划线）', `#nt-role-${i}`];
    const j = NT.roles.findIndex((r) => !r.candidates.length);
    if (j >= 0) return [`角色 ${NT.roles[j].label} 还没选候选物体`, `#nt-chips-r${j} + .opick input`];
    const k = NT.roles.findIndex((r) => !(r.count >= 1));
    if (k >= 0) return ['每回合数量至少为 1', `#nt-count-${k}`];
    const lo = ntNum($('#nt-dis-min').value), hi = ntNum($('#nt-dis-max').value);
    if (lo != null && hi != null && lo > hi) return ['干扰物最少数量不能大于最多数量', '#nt-dis-min'];
  }
  if (WIZ_AT === 2 && !NT.scenes.train.length) return ['至少选一个训练场景', '#nt-chips-sc-train + .opick input'];
  if (WIZ_AT === 3) {
    const k = Object.keys(AXIS_NEEDS).find((x) => NT.axes[x].max === 3 && !AXIS_NEEDS[x][0]());

  }
  return [''];
}

async function unregisterTask(id) {
  const d = S.task.find((x) => x.id === id);
  if (!confirm(`删除 ${id} 的平台登记？${d?.auto.module ? '任务本身和采集记录保留。' : ''}`)) return;
  if (!d?.auto.module) {
    try {
      await api(`/api/items?kind=task&id=${encodeURIComponent(id)}`, {method: 'DELETE'});
    } catch (err) { return toast(`删除失败：${err.message}`, true); }
    await sync(true);
    closeDrawer();
  } else if (!await save('task', id, {registered: false, reg: null})) return;
  toast('已删除登记');
}

async function api(url, options = {}) {

    throw new Error('访客账号只能查看');

  const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...options});
  if (r.status === 401 && ME && url !== '/api/password') { showLogin('登录已过期，请重新登录'); throw new Error('请先登录'); }
  if (!r.ok) throw new Error((await r.json().catch(() => null))?.error || `${r.status} ${r.statusText}`);

}

function wizGo(n) {
  const last = WZ.steps.length - 1;
  n = Math.max(0, Math.min(last, n));
  const from = WIZ_AT;
  let [e, bad] = [''], skipped = [];
  if (n < WIZ_AT) WIZ_AT = n;
  else {  // forward: every step passed on the way must be complete; admins may leave fields empty
    while (WIZ_AT < n) {
      [e, bad] = WZ.check();
      if (e && !ME?.admin) break;
      if (e) skipped.push(e);
      [e, bad] = [''];
      WIZ_AT++;
    }
  }
  $('#no-err').textContent = e || (skipped.length ? `管理员已跳过：${skipped.join('；')}` : '');
  $$('.wiz-pane [aria-invalid]').forEach((x) => x.removeAttribute('aria-invalid'));
  $$('.wiz-pane').forEach((p) => { p.hidden = Number(p.dataset.step) !== WIZ_AT; });
  $$('[data-wiz]').forEach((b) => { const k = Number(b.dataset.wiz); b.className = k === WIZ_AT ? 'on' : k < WIZ_AT ? 'done' : ''; b.setAttribute('aria-current', k === WIZ_AT ? 'step' : 'false'); });
  $('#wiz-back').style.visibility = WIZ_AT ? '' : 'hidden';
  $('#wiz-next').hidden = WIZ_AT === last;
  $('#wiz-done').hidden = WIZ_AT !== last;
  if (WIZ_AT !== from) WZ.onStep?.(WIZ_AT);
  if (bad) { $(bad).setAttribute('aria-invalid', 'true'); $(bad).setAttribute('aria-describedby', 'no-err'); $(bad).focus(); }  // the field to fix
  else if (WIZ_AT !== from) { $('#drawer .dr-b').scrollTop = 0; $(`.wiz-pane[data-step="${WIZ_AT}"] input, .wiz-pane[data-step="${WIZ_AT}"] textarea`)?.focus({preventScroll: true}); }
}

      if (!v.stopped) status.textContent = `3D 预览加载失败：${err.message || err}（three.js 从 registry.npmmirror.com 加载，内网环境需能访问它）`;
    });
  return v;
}
function onKey(ev) {
  if ($('#lightbox').classList.contains('on')) {
    if (ev.key === 'Escape') closeLB();
    else if (ev.key === 'ArrowLeft') lbStep(-1);
    else if (ev.key === 'ArrowRight') lbStep(1);
    else return;
    ev.preventDefault();
    return;
  }
  if (!ME) return;
  if (ev.key === 'Escape' && UI.dd) { const id = UI.dd; UI.dd = ''; render(); $(`#${id}`)?.focus(); return; }
  if (ev.key === 'Escape' && UI.drawer) { closeDrawer(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-open][tabindex]')) { ev.preventDefault(); ev.target.click(); return; }
  if (UI.tab !== 'qa' || UI.drawer || ev.target.matches('input, textarea, select, video') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const list = qaList(), i = list.findIndex((e) => e.id === UI.ep), k = ev.key.toLowerCase();
  if (k === 'j' || k === 'arrowdown') pick(list[Math.min(i + 1, list.length - 1)]?.id);
  else if (k === 'k' || k === 'arrowup') pick(list[Math.max(i - 1, 0)]?.id);
  else if (UI.ep && k === 'p') setQA('pass');
  else if (UI.ep && k === 'r') setQA('reject');
  else if (UI.ep && k === 'u') setQA('pending');
  else return;
  ev.preventDefault();
}
function onClick(ev) {
  if (UI.dd && !ev.target.closest('.dd')) { UI.dd = ''; render(); }
  const lb = ev.target.closest('[data-lb]');
  if (lb) { lightbox(GAL[lb.dataset.lb], Number(lb.dataset.i)); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { ev.preventDefault(); go(g.dataset.go, g.dataset.id); return; }
  const o = ev.target.closest('[data-open]');
  if (!o) return;
  const control = ev.target.closest('input, button, a, label, select, textarea, video');
  if (control && control !== o && o.contains(control)) return;  // controls inside a row or card act on their own
  if (o.dataset.open === 'episode') pick(o.dataset.id);
  else openDrawer(o.dataset.open, o.dataset.id, o);
}

// ---------- render ----------
const VIEWS = {overview: viewOverview, scenes: viewScenes, objects: viewObjects, robots: viewRobots, tasks: viewTasks, qa: viewQA, evals: viewEvals, prototypes: viewPrototypes, users: viewUsers, datasets: viewDatasets};
function render() {
  EP_BY_TASK = group(live(S.episode), (e) => e.auto.task);
  renderNav();
  if (!UI.loaded) return;
  const focus = document.activeElement?.id, scroll = $('.qa-list')?.scrollTop, oldVideos = $('#qa-videos'), opening = UI.drawerFocus;
  const sideScroll = $('.ds-side')?.scrollTop, segs = segSnapshot();
  $('#main').innerHTML = VIEWS[UI.tab]();
  if (sideScroll && $('.ds-side')) $('.ds-side').scrollTop = sideScroll;
  placeMenus();
  const slot = $('#qa-videos');
  if (oldVideos && slot && oldVideos.dataset.ep === slot.dataset.ep) slot.replaceWith(oldVideos);  // keep playback position
  else if (slot) videos('rate', UI.qaRate);
  if (scroll && $('.qa-list')) $('.qa-list').scrollTop = scroll;
  renderDrawer();
  guestLock($('#main'));
  guestLock($('#drawer'));
  segSlide(segs);
  mountModel();
  const el = focus && document.getElementById(focus);
  if (el && el !== document.activeElement && !opening) {
    el.focus({preventScroll: true});
    if (el.type === 'text') el.setSelectionRange(el.value.length, el.value.length);
  }
}
const tabFromHash = () => (VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview');
window.addEventListener('hashchange', () => { UI.tab = tabFromHash(); stashDraft(); UI.drawer = null; render(); window.scrollTo(0, 0); });
document.addEventListener('change', onFieldChange);
document.addEventListener('keydown', onKey);
document.addEventListener('click', onClick);
$('#lightbox').addEventListener('click', (ev) => { if (ev.target.classList.contains('lb-stage')) closeLB(); });
const THEMES = [['light', '日间', 'sun'], ['dark', '夜间', 'moon'], ['system', '跟随系统', 'monitor']];
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('bzf-theme', t);
  $('#theme').innerHTML = THEMES.map(([k, label, icon]) => `<button type="button" class="btn btn-icon btn-ghost" aria-pressed="${t === k}" aria-label="${label}" title="${label}" onclick="setTheme('${k}')">${ic(icon)}</button>`).join('');
}
setTheme(document.documentElement.dataset.theme);
// the page glides to where the wheel sends it (a damped ease) instead of stepping; inner panels that can still scroll,
// sideways and zoom gestures, open drawers and reduced motion keep the browser's own scrolling
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let target = 0, last = 0, raf = 0;
  const innerScrolls = (el, dy) => {
    for (; el && el !== document.body; el = el.parentElement) {
      if (el.scrollHeight > el.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(el).overflowY)
        && (dy < 0 ? el.scrollTop > 0 : el.scrollTop + el.clientHeight < el.scrollHeight - 1)) return true;
    }
    return false;
  };
  const glide = () => {
    raf = 0;
    if (Math.abs(scrollY - last) > 1.5) return;  // keys, the scrollbar or a scrollTo moved the page: they win
    const d = target - scrollY;
    if (Math.abs(d) < 1.5) {  // scroll positions snap to whole pixels: finish instead of creeping forever
      scrollTo(0, target);
      return;
    }
    last = scrollY + (Math.abs(d) * 0.14 < 1 ? Math.sign(d) : d * 0.14);
    scrollTo(0, last);
    raf = requestAnimationFrame(glide);
  };
  addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY) || $('#drawer.on, #lightbox.on') || innerScrolls(e.target, e.deltaY)) return;
    e.preventDefault();
    if (!raf) target = last = scrollY;
    const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1);
    target = Math.max(0, Math.min(target + dy, document.documentElement.scrollHeight - innerHeight));
    if (!raf) raf = requestAnimationFrame(glide);
  }, {passive: false});
})();
UI.tab = tabFromHash();
renderNav();
fetch('/api/me').then((r) => (r.ok ? r.json() : null)).then((me) => {
  if (!me) return showLogin();
  ME = me;
  return enter();
}).catch((err) => toast(`加载失败：${err.message}`, true));
</script>
